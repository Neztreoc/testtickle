<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TestTickle password</title>
<style>
  :root{--bg:#f5f6fa;--card:#fff;--line:#e3e6ef;--text:#0f172a;--dim:#516078;--accent:#2563eb;--on:#fff}
  @media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#141a2e;--line:#26304f;--text:#e8ecf8;--dim:#8e9bbd;--accent:#7fa5ff;--on:#0b1020}}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif;padding:16px}
  main{width:min(560px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:12px}
  h1{margin:0;font-size:22px}p{margin:0;color:var(--dim)}
  input,textarea{width:100%;font:inherit;padding:10px 12px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px}
  textarea{font:13px ui-monospace,Consolas,monospace}
  button{font:inherit;font-weight:600;padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:var(--on);cursor:pointer;justify-self:start}
  .err{color:#dc2626}
</style>
</head>
<body>
<main>
  <h1>Set your password</h1>
  <p>Type a password and copy the line below into <code>config.js</code>. Your password never leaves this page.</p>
  <input id="pw" type="password" placeholder="New password (12+ characters)" autocomplete="new-password">
  <input id="pw2" type="password" placeholder="Repeat password" autocomplete="new-password">
  <button id="go" type="button">Make config line</button>
  <p id="msg"></p>
  <textarea id="out" rows="3" readonly hidden></textarea>
  <button id="copy" type="button" hidden>Copy line</button>
</main>
<script>
const $ = id => document.getElementById(id);
const b64 = u => btoa(String.fromCharCode(...u));
$('go').onclick = async () => {
  const m = $('msg'); m.className = 'err';
  if ($('pw').value.length < 12) return m.textContent = 'Use at least 12 characters.';
  if ($('pw').value !== $('pw2').value) return m.textContent = 'The two passwords do not match.';
  const iter = 210000, salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode($('pw').value), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, key, 256));
  $('out').value = `passwordHash: "pbkdf2$${iter}$${b64(salt)}$${b64(bits)}"`;
  $('out').hidden = $('copy').hidden = false;
  m.className = ''; m.textContent = 'In config.js, replace the passwordHash line with this one.';
  $('pw').value = $('pw2').value = '';
};
$('copy').onclick = () => { $('out').select(); navigator.clipboard.writeText($('out').value); $('copy').textContent = 'Copied'; };
</script>
</body>
</html>
